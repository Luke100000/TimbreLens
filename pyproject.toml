[project]
name = "timbrelens"
version = "0.1.0"
description = "An offline audio catalog pipeline and static music search."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=4,<5",
    "diskcache>=5.6,<6",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
timbrelens = "timbrelens.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timbrelens"]

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
